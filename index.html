<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>在庫管理アプリ v6.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Inter","Noto Sans JP",sans-serif; }
    .view { display:none; animation: fadeIn .25s ease-in-out; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    @keyframes shake{ 10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)} 30%,50%,70%{transform:translate3d(-4px,0,0)} 40%,60%{transform:translate3d(4px,0,0)} }
    .shake-error{animation:shake .82s cubic-bezier(.36,.07,.19,.97) both}
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0 }
    input[type="number"]{ -moz-appearance:textfield }
    .square-img{ width:100%; max-width:480px; aspect-ratio:1/1; overflow:hidden; border-radius:.75rem; background:#f3f4f6; margin:0 auto }
    .square-img>img{ width:100%; height:100%; object-fit:cover; display:block }
    .blur-up{ filter:blur(12px); transition:filter .28s ease }
    .blur-up.loaded{ filter:blur(0) }
    #loading-overlay{z-index:70}
    #alert-modal,#confirm-modal,#edit-item-modal{z-index:80}
    .inventory-fit{ display:flex; flex-direction:column; gap:.5rem }
    .inventory-grid{ display:grid; grid-template-columns:1fr auto; gap:.5rem; align-items:start }
    .square-btn{ width:2.5rem; height:2.5rem }
    .roller-input{ font-size:2rem; line-height:1; padding:.5rem .75rem }
  </style>
</head>
<body class="bg-gray-100">
<div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
  <header id="app-header" class="bg-blue-600 text-white p-4 flex justify-between items-center hidden">
    <div class="flex items-center space-x-3">
      <button id="main-menu-button" class="hidden flex items-center space-x-2 p-2 -ml-2 rounded-md hover:bg-blue-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
        <span class="text-lg font-bold">ホーム</span>
      </button>
      <span id="header-app-title" class="hidden text-lg font-bold">物品管理 v6.1</span>
    </div>
    <div class="text-right">
      <p id="user-name" class="text-sm"></p>
      <button id="logout-button" class="text-xs text-blue-200 hover:underline">ログアウト</button>
    </div>
  </header>

  <main id="main-root" class="p-4 md:p-6">
    <!-- Login -->
    <div id="view-login" class="view">
      <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">在庫管理 v6.1</h2>
      <div class="space-y-6">
        <div class="p-4 border rounded-lg">
          <h3 class="font-bold mb-2">管理者 / 使用者の方</h3>
          <p class="text-sm text-gray-600 mb-4">5桁のユーザー番号を入力してください</p>
          <input type="number" id="login-id-input" inputmode="numeric" pattern="[0-9]*" class="w-full p-4 border-2 border-gray-300 rounded-lg text-center text-4xl tracking-[.5em] focus:border-blue-500 focus:ring-blue-500" maxlength="5" />
        </div>
        <div class="p-4 border rounded-lg">
          <button id="other-staff-login-button" class="w-full bg-gray-500 text-white p-3 rounded-md hover:bg-gray-600 transition-colors">その他の方はこちら</button>
        </div>
      </div>
    </div>

    <!-- Home -->
    <div id="view-home-user" class="view">
      <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">メインメニュー</h2>
      <div class="grid grid-cols-2 gap-4">
        <button id="item-list-button" class="col-span-2 bg-indigo-500 hover:bg-indigo-600 text-white p-6 rounded-lg text-lg font-bold">物品一覧</button>
        <button id="inventory-count-button" class="col-span-2 bg-cyan-500 hover:bg-cyan-600 text-white p-6 rounded-lg text-lg font-bold">棚卸し作業</button>
        <button id="new-item-button" class="col-span-2 bg-blue-500 hover:bg-blue-600 text-white p-6 rounded-lg text-lg font-bold">新規物品登録</button>
        <button id="order-history-button" class="col-span-2 bg-gray-500 hover:bg-gray-600 text-white p-6 rounded-lg text-lg font-bold">発注履歴</button>
        <button id="cart-button" class="col-span-2 bg-pink-500 hover:bg-pink-600 text-white p-6 rounded-lg text-lg font-bold hidden relative">発注カートを開く</button>
      </div>
    </div>

    <!-- others login -->
    <div id="view-home-other-1" class="view">
      <h3 class="font-bold text-lg mb-4">部署/職種を選択してください</h3>
      <div id="department-list" class="flex flex-wrap gap-3 justify-center"><p class="text-gray-500">部署を読み込み中...</p></div>
      <button class="back-button mt-6 w-full text-center text-gray-600" data-target="view-login">戻る</button>
    </div>

    <div id="view-home-other-2" class="view">
      <h3 class="font-bold text-lg mb-4">お名前とPHS番号を入力してください</h3>
      <input type="text" id="other-name-input" placeholder="お名前 *" class="w-full p-3 border rounded-md mb-3 focus:ring-2 focus:ring-blue-500" />
      <input type="number" id="phs-input" placeholder="PHS番号" class="w-full p-3 border rounded-md mb-4 focus:ring-2 focus:ring-blue-500" />
      <button id="phs-submit-button" class="w-full bg-blue-500 text-white p-3 rounded-md hover:bg-blue-600">次へ</button>
      <button class="back-button mt-4 w-full text-center text-gray-600" data-target="view-home-other-1">戻る</button>
    </div>

    <div id="view-home-other-menu" class="view">
      <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">メインメニュー</h2>
      <div class="p-4 border rounded-lg bg-yellow-50 text-yellow-900">このアカウントでの操作は制限されています。</div>
      <button class="back-button mt-6 w-full text-center text-gray-600" data-target="view-login">ログイン画面に戻る</button>
    </div>

    <!-- Quantity (In/Out) -->
    <div id="view-quantity" class="view">
      <h2 id="quantity-title" class="text-xl font-bold text-center mb-4"></h2>
      <p id="final-code-display" class="text-center p-2 bg-gray-100 rounded-md mb-2 text-sm text-gray-600"></p>
      <p id="item-name-display-quantity" class="text-center text-lg font-bold mb-4 text-gray-800 h-7"></p>
      <label class="font-bold">数量を入力してください:</label>
      <input type="number" id="quantity-input" class="w-full p-4 border-2 rounded-lg text-3xl text-center mt-2" inputmode="numeric" />
      <button id="submit-stock-update" class="w-full bg-blue-500 text-white p-4 rounded-lg mt-4 text-lg font-bold hover:bg-blue-600">登録</button>
      <button class="back-button mt-4 w-full text-center text-gray-600">戻る</button>
    </div>

    <!-- New item -->
    <div id="view-new-item" class="view">
      <h2 class="text-xl font-bold mb-4">新規物品登録</h2>
      <div class="mb-4">
        <label class="text-sm font-semibold mb-2 block">物品写真（任意）</label>
        <div id="new-item-photo-preview" class="square-img mb-2 bg-gray-100 flex items-center justify-center">
          <span class="text-gray-400 text-sm">写真未登録</span>
        </div>
        <button id="new-item-photo-button" class="w-full bg-purple-500 text-white p-2 rounded-md hover:bg-purple-600">写真を登録</button>
      </div>
      <div class="space-y-3">
        <input type="text" id="new-item-name" placeholder="物品名 *" class="w-full p-3 border rounded-md" />
        <input type="text" id="new-model" placeholder="型番/規格" class="w-full p-3 border rounded-md" />
        <input type="number" id="new-stock" placeholder="初期在庫数 *" class="w-full p-3 border rounded-md" />
        <input type="number" id="new-reorder-point" placeholder="発注点 *" class="w-full p-3 border rounded-md" />
        <input type="number" id="new-price" placeholder="単価（円） *" class="w-full p-3 border rounded-md" />
        <input type="email" id="new-supplier-email" list="supplier-email-list" placeholder="発注先メールアドレス *" class="w-full p-3 border rounded-md" />
        <input type="number" id="new-par-level" placeholder="発注上限" class="w-full p-3 border rounded-md" />
        <input type="text" id="new-use-for" placeholder="用途" class="w-full p-3 border rounded-md" />
        <datalist id="supplier-email-list"></datalist>
      </div>
      <button id="submit-new-item" class="w-full bg-blue-500 text-white p-3 rounded-md mt-4 font-bold">登録する</button>
      <button class="back-button mt-4 w-full text-center text-gray-600">戻る</button>
    </div>

    <!-- Order history -->
    <div id="view-order-history" class="view">
      <h2 class="text-xl font-bold mb-4">発注履歴</h2>
      <div id="order-history-list" class="space-y-3"></div>
      <button class="back-button mt-4 w-full text-center text-gray-600">戻る</button>
    </div>

    <!-- Cart -->
    <div id="view-cart" class="view">
      <h2 class="text-xl font-bold mb-4 text-center">発注カート（取りまとめ）</h2>
      <div id="cart-container" class="space-y-6"></div>
      <div class="mt-6">
        <button id="submit-cart-button" class="w-full bg-red-500 text-white p-4 rounded-lg text-lg font-bold hover:bg-red-600">一括発注する</button>
        <button class="back-button mt-4 w-full text-center text-gray-600">戻る</button>
      </div>
    </div>

    <!-- Done -->
    <div id="view-action-complete" class="view text-center py-12">
      <svg class="mx-auto h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <h2 id="complete-message" class="mt-4 text-2xl font-bold text-gray-800"></h2>
      <p id="complete-sub-message" class="text-gray-600 mt-2 leading-relaxed text-sm"></p>
    </div>

    <!-- Item list (v6.1 超高速HTML側キャッシュ方式) -->
    <div id="view-item-list" class="view">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">物品一覧</h2>
        <button id="refresh-item-list" class="text-sm bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded-md flex items-center gap-1">強制更新</button>
      </div>
      <div class="mb-4 space-y-2">
        <input type="text" id="item-search-input" class="w-full p-2 border rounded-md" placeholder="物品名で検索..." />
        <div class="flex items-center space-x-4 text-sm">
          <label class="flex items-center"><input type="checkbox" id="filter-reorder-needed" class="mr-2" />要発注</label>
          <label class="flex items-center"><input type="checkbox" id="filter-on-order" class="mr-2" />発注中</label>
        </div>
      </div>
      <div id="item-list-container" class="space-y-3"></div>
      <button class="back-button mt-6 w-full text-center text-gray-600">戻る</button>
    </div>

    <!-- Inventory count (v6.1 1つ戻るボタン追加) -->
    <div id="view-inventory-count" class="view">
      <h2 class="text-xl font-bold text-center mb-2">棚卸し作業</h2>
      <p id="inventory-count-progress" class="text-center text-sm text-gray-500 mb-2"></p>
      <div id="inventory-fit-root" class="inventory-fit p-3 border rounded-lg bg-gray-50">
        <div class="square-img"><img id="inventory-image" alt="物品画像" class="blur-up" loading="lazy" /></div>
        <div class="inventory-grid">
          <div class="flex flex-col justify-between">
            <div>
              <h3 id="inventory-item-name" class="text-base font-bold text-gray-800 leading-tight"></h3>
              <p class="text-xs text-gray-600 mt-1 mb-2">用途: <span id="inventory-usefor" class="font-medium text-gray-700"></span></p>
            </div>
            <div class="flex flex-col space-y-2">
              <button id="inventory-prev-button" class="px-3 py-2 rounded-md border border-gray-300 text-gray-700 bg-white shadow-sm text-sm font-semibold flex items-center justify-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg> 1つ前に戻る
              </button>
              <button id="inventory-back-button" class="px-3 py-2 rounded-md border border-gray-300 text-gray-500 bg-gray-100 text-sm flex items-center justify-center">中断してホームへ</button>
            </div>
          </div>
          <div class="justify-self-end flex flex-col justify-between h-full">
            <div class="flex items-center space-x-2">
              <button id="roll-dec" class="square-btn rounded bg-gray-200 flex items-center justify-center font-bold">−</button>
              <input type="number" id="inventory-actual-stock" class="roller-input w-20 border-2 rounded-lg text-center" inputmode="numeric" />
              <button id="roll-inc" class="square-btn rounded bg-gray-200 flex items-center justify-center font-bold">＋</button>
            </div>
            <button id="inventory-confirm-button" class="mt-auto w-full bg-green-600 text-white rounded-md font-bold flex items-center justify-center py-3">確定して次へ</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Overlays & Modals -->
<div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden"><div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div></div>
<div id="alert-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden"><div class="bg-white p-6 rounded-lg w-11/12 max-w-sm text-center"><p id="alert-message" class="mb-4 text-gray-700 leading-relaxed"></p><button id="alert-ok-button" class="bg-blue-500 text-white px-8 py-2 rounded-md">OK</button></div></div>
<div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden"><div class="bg-white p-6 rounded-lg w-11/12 max-w-sm text-center"><p id="confirm-message" class="mb-6 text-gray-700"></p><div class="flex justify-center space-x-4"><button id="confirm-cancel-button" class="bg-gray-300 text-gray-800 px-8 py-2 rounded-md">いいえ</button><button id="confirm-ok-button" class="bg-blue-500 text-white px-8 py-2 rounded-md">はい</button></div></div></div>

<!-- Edit Item Modal -->
<div id="edit-item-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
  <div class="bg-white p-6 rounded-lg shadow-xl w-11/12 max-w-md h-[80vh] overflow-y-auto">
    <h3 class="text-lg font-bold mb-4">物品情報の変更</h3>
    <div class="space-y-3">
      <div><label class="text-sm font-semibold">物品名 *</label><input type="text" id="edit-item-name" class="w-full p-2 border rounded-md" /></div>
      <div><label class="text-sm font-semibold">在庫数 *</label><input type="number" id="edit-stock" class="w-full p-2 border rounded-md" /></div>
      <div><label class="text-sm font-semibold">発注点 *</label><input type="number" id="edit-reorder-point" class="w-full p-2 border rounded-md" /></div>
      <div><label class="text-sm font-semibold">単価（円） *</label><input type="number" id="edit-price" class="w-full p-2 border rounded-md" /></div>
      <div><label class="text-sm font-semibold">発注上限</label><input type="number" id="edit-par-level" class="w-full p-2 border rounded-md" /></div>
      <div><label class="text-sm font-semibold">発注中数量</label><input type="number" id="edit-ordered-quantity" class="w-full p-2 border rounded-md" /></div>
    </div>
    <div class="flex justify-end space-x-3 mt-6">
      <button id="edit-item-cancel" class="bg-gray-300 px-6 py-2 rounded-md">キャンセル</button>
      <button id="edit-item-save" class="bg-blue-500 text-white px-6 py-2 rounded-md">保存</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const APP_VERSION = "2026.03.24.r6.1";
  console.log('=== 在庫管理アプリ v6.1 起動 ===');
  
  // =========================================================
  // 【重要】最新のGAS Web App URL（/exec）に変更してください
  // =========================================================
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyDBIw4wGWagJgTUgfUfUMrWRcwl640UctwACfd1Ze8l_vJvrETtrVzQ5k66DkP7V5i/exec";
  const CACHE_KEY_ITEMS = "inventory_app_items_cache_v6"; // ★ブラウザ側キャッシュ用キー
  
  const state = { user:null, currentView:null, historyStack:[], itemList:[], cartItems:[], stockUpdate:{}, otherUserInfo:{}, inventoryCount:{ items:[], currentIndex:0, currentItemId:null } };
  let currentEditItemId = null;

  const dom = {
    views:document.querySelectorAll(".view"), loading:document.getElementById("loading-overlay"),
    header:document.getElementById("app-header"), headerTitle:document.getElementById("header-app-title"),
    mainMenuBtn:document.getElementById("main-menu-button"), mainRoot:document.getElementById("main-root"),
    userName:document.getElementById("user-name"), loginId:document.getElementById("login-id-input"),
    modals:{ alert:document.getElementById("alert-modal"), confirm:document.getElementById("confirm-modal"), edit:document.getElementById("edit-item-modal") }
  };

  const freezeBody = (on)=>document.body.classList.toggle("overflow-hidden", on);
  const sizeInventoryView = ()=>{
    const view = document.getElementById("inventory-fit-root");
    if(!view) return;
    const headerH = dom.header.classList.contains("hidden") ? 0 : dom.header.offsetHeight;
    const pad = parseFloat(getComputedStyle(dom.mainRoot).paddingTop) + parseFloat(getComputedStyle(dom.mainRoot).paddingBottom);
    view.style.minHeight = `calc(100vh - ${headerH + pad}px)`;
  };

  const showView = (id, isBack=false)=>{
    dom.views.forEach(v=>v.style.display="none");
    const el = document.getElementById(id);
    if(el){ el.style.display="block"; if(!isBack && state.currentView) state.historyStack.push(state.currentView); state.currentView = id; }
    dom.header.classList.toggle("hidden", id==="view-login" || id==="view-home-other-1");
    dom.headerTitle.classList.toggle("hidden", id!=="view-home-user");
    dom.mainMenuBtn.classList.toggle("hidden", id==="view-home-user");
    if(id==="view-inventory-count"){ freezeBody(true); sizeInventoryView(); } else { freezeBody(false); }
  };

  const goBack = ()=>{ const p = state.historyStack.pop(); if(p) showView(p,true); };
  const goHome = ()=>{ state.historyStack=[]; showView("view-home-user"); };
  const toggleLoading = on => dom.loading.classList.toggle("hidden", !on);
  const clearCache = () => sessionStorage.removeItem(CACHE_KEY_ITEMS); // ★キャッシュ削除処理
  
  let alertCb=null, confirmCb=null;
  const showAlert = (m, cb=null)=>{ document.getElementById("alert-message").innerHTML=String(m).replace(/\n/g, '<br>'); dom.modals.alert.classList.remove("hidden"); alertCb = cb; };
  const showConfirm = (m,onOk)=>{ document.getElementById("confirm-message").textContent=m; dom.modals.confirm.classList.remove("hidden"); confirmCb=onOk; };
  const hideAllModals = ()=>{ dom.modals.alert.classList.add("hidden"); dom.modals.confirm.classList.add("hidden"); dom.modals.edit.classList.add("hidden"); };
  const showDoneAnd = (m,sub,next)=>{ document.getElementById("complete-message").innerHTML=String(m).replace(/\n/g, '<br>'); document.getElementById("complete-sub-message").innerHTML=String(sub||"").replace(/\n/g, '<br>'); showView("view-action-complete"); setTimeout(next,2000); };

  // API通信
  const callGasApi = async (action, payload = {}, retryCount = 0) => {
    const readActions = ['get_item_list', 'get_departments', 'get_supplier_emails', 'get_cart', 'get_order_history', 'get_inventory_progress'];
    const maxRetries = readActions.includes(action) ? 1 : 0;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    try {
      const req = { action, payload };
      if (state.user && !['login','get_departments','get_supplier_emails'].includes(action)) req.payload.auth = state.user;
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST", mode: "cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(req), signal: controller.signal
      });
      clearTimeout(timeoutId);
      const json = await res.json();
      if(json.status==="error") throw new Error(json.message);
      return json;
    } catch (e) {
      clearTimeout(timeoutId);
      if (e.name === 'AbortError' || e.message === 'Failed to fetch') {
        if (retryCount < maxRetries) { console.log(`[Retry] ${action}`); return callGasApi(action, payload, retryCount + 1); }
      }
      showAlert(`通信エラー: ${e.name === 'AbortError' ? 'タイムアウトしました' : e.message}`);
      return null;
    }
  };

  // Image helpers
  function extractDriveFileId(u){
    if(!u) return null; if(/^[A-Za-z0-9_-]{20,}$/.test(u)) return u;
    let m=String(u).match(/\/file\/d\/([A-Za-z0-9_-]+)\//); if(m) return m[1];
    m=String(u).match(/[?&]id=([A-Za-z0-9_-]+)/); if(m) return m[1];
    m=String(u).match(/\/d\/([A-Za-z0-9_-]+)/); if(m) return m[1];
    return null;
  }
  function setProgressiveImage(img,url){
    const id = extractDriveFileId(url);
    if(!id){ img.removeAttribute("src"); img.classList.remove("loaded"); return; }
    img.classList.remove("loaded");
    img.onerror = ()=>{ requestAnimationFrame(()=>img.classList.add("loaded")); };
    img.onload = ()=>{ requestAnimationFrame(()=>img.classList.add("loaded")); };
    img.src = `https://lh3.googleusercontent.com/d/${id}=s480-c`;
  }

  // Auth
  document.getElementById("login-id-input").addEventListener("input", async (e) => {
    if(e.target.value.length === 5) {
      toggleLoading(true);
      const res = await callGasApi("login", {loginId: e.target.value});
      toggleLoading(false);
      if(res && res.status === "success") {
        state.user = res.data;
        dom.userName.textContent = state.user.name;
        document.getElementById("cart-button").classList.toggle("hidden", state.user.role !== '管理者');
        if(["管理者","使用者"].includes(state.user.role)) showView("view-home-user");
        else { showView("view-home-other-1"); loadDepartments(); }
      } else {
        dom.loginId.classList.add("shake-error"); setTimeout(()=>dom.loginId.classList.remove("shake-error"), 820);
        e.target.value = "";
      }
    }
  });

  const loadDepartments=async()=>{ const res=await callGasApi("get_departments"); if(res) { const list=document.getElementById("department-list"); list.innerHTML=""; res.data.forEach(n=>{ const b=document.createElement("button"); b.textContent=n; b.className="bg-white border px-4 py-2 rounded-full hover:bg-gray-100"; b.onclick=()=>{ state.otherUserInfo.department=n; showView("view-home-other-2"); }; list.appendChild(b); }); }};
  const loadSupplierEmails=async()=>{ const res=await callGasApi("get_supplier_emails"); if(res){ const dl=document.getElementById("supplier-email-list"); dl.innerHTML=""; res.data.forEach(e=>{ const o=document.createElement("option"); o.value=e; dl.appendChild(o); }); }};

  // ★ 物品一覧 (HTML側キャッシュ方式: SWR で爆速化)
  const loadItems = async (force = false) => {
    showView("view-item-list");
    const cached = sessionStorage.getItem(CACHE_KEY_ITEMS);
    
    // キャッシュがあれば即表示(0秒)
    if (cached && !force) {
      state.itemList = JSON.parse(cached);
      renderItems();
      
      // 裏側でこっそり最新化
      callGasApi("get_item_list").then(res => {
        if(res && res.data) {
          state.itemList = res.data;
          sessionStorage.setItem(CACHE_KEY_ITEMS, JSON.stringify(res.data));
          if(state.currentView === "view-item-list") renderItems();
        }
      });
    } else {
      // キャッシュなし or 強制更新時
      toggleLoading(true);
      const res = await callGasApi("get_item_list");
      toggleLoading(false);
      if(res) {
        state.itemList = res.data;
        sessionStorage.setItem(CACHE_KEY_ITEMS, JSON.stringify(res.data));
        renderItems();
      }
    }
  };

  const renderItems = () => {
    const q = document.getElementById("item-search-input").value.toLowerCase();
    const onlyRe = document.getElementById("filter-reorder-needed").checked;
    const onlyOn = document.getElementById("filter-on-order").checked;
    
    let items = state.itemList.filter(i => {
      let m = (i.itemName || "").toLowerCase().includes(q);
      if(onlyRe && i.stock >= i.reorderPoint) m = false;
      if(onlyOn && i.orderedQuantity <= 0) m = false;
      return m;
    });

    document.getElementById("item-list-container").innerHTML = items.length === 0 ? `<p class="text-center text-gray-500">該当する物品はありません。</p>` : items.map(item => `
      <div class="item-card p-3 border rounded-lg bg-white shadow-sm" data-id="${item.itemId}">
        <div class="flex items-start justify-between">
          <div><h3 class="font-bold text-base">${item.itemName}</h3><p class="text-xs text-gray-500">ID: ${item.itemId}</p></div>
          <div class="w-16 h-16 bg-gray-100 rounded overflow-hidden">
            ${item.imageUrl ? `<img src="https://lh3.googleusercontent.com/d/${extractDriveFileId(item.imageUrl)}=s120-c" class="w-full h-full object-cover">` : ''}
          </div>
        </div>
        <div class="mt-2 text-sm flex justify-between">
          <div>在庫: <span class="font-bold text-lg">${item.stock}</span> <span class="text-red-500 text-xs">(発注点: ${item.reorderPoint})</span></div>
          <div class="text-gray-500 text-xs">未納: ${item.orderedQuantity}</div>
        </div>
        <div class="mt-3 flex justify-end space-x-2">
          <button class="bg-purple-500 text-white px-3 py-1 rounded text-sm btn-photo">写真</button>
          <button class="bg-gray-500 text-white px-3 py-1 rounded text-sm btn-edit">変更</button>
          <button class="bg-green-500 text-white px-3 py-1 rounded text-sm btn-in">入庫</button>
          <button class="bg-yellow-500 text-white px-3 py-1 rounded text-sm btn-out">出庫</button>
        </div>
      </div>
    `).join("");
  };

  document.getElementById("item-list-container").addEventListener("click", e => {
    const card = e.target.closest(".item-card"); if(!card) return;
    const id = card.dataset.id; const item = state.itemList.find(i=>i.itemId===id); if(!item) return;

    if(e.target.classList.contains("btn-edit")){
      currentEditItemId = id;
      document.getElementById("edit-item-name").value = item.itemName; document.getElementById("edit-stock").value = item.stock;
      document.getElementById("edit-reorder-point").value = item.reorderPoint; document.getElementById("edit-price").value = item.price;
      document.getElementById("edit-par-level").value = item.parLevel; document.getElementById("edit-ordered-quantity").value = item.orderedQuantity;
      dom.modals.edit.classList.remove("hidden");
    } else if(e.target.classList.contains("btn-in") || e.target.classList.contains("btn-out")){
      const action = e.target.classList.contains("btn-in") ? "入庫" : "出庫";
      state.stockUpdate = { itemId: id, action };
      document.getElementById("quantity-title").textContent = action;
      document.getElementById("item-name-display-quantity").textContent = item.itemName;
      document.getElementById("final-code-display").textContent = `ID: ${id}`;
      document.getElementById("quantity-input").value = "";
      showView("view-quantity");
    } else if(e.target.classList.contains("btn-photo")){
      pickAndUploadPhoto(id);
    }
  });

  // Quantity / Update
  document.getElementById("submit-stock-update").addEventListener("click", async () => {
    const qty = parseInt(document.getElementById("quantity-input").value, 10);
    if(!qty || qty<=0) return showAlert("正しい数量を入力してください");
    toggleLoading(true);
    const res = await callGasApi("stock_update", { itemId: state.stockUpdate.itemId, type: state.stockUpdate.action, quantity: qty, department: state.otherUserInfo.department, phs: state.otherUserInfo.phs });
    toggleLoading(false);
    if(res) { 
      clearCache(); // ★更新時はキャッシュ破棄
      document.getElementById("quantity-input").value=""; 
      showDoneAnd("更新完了", res.message, () => loadItems(true)); 
    } 
  });

  document.getElementById("edit-item-save").addEventListener("click", async () => {
    const payload = {
      itemId: currentEditItemId, itemName: document.getElementById("edit-item-name").value.trim(),
      stock: Number(document.getElementById("edit-stock").value), reorderPoint: Number(document.getElementById("edit-reorder-point").value),
      price: Number(document.getElementById("edit-price").value), parLevel: document.getElementById("edit-par-level").value.trim(),
      orderedQuantity: Number(document.getElementById("edit-ordered-quantity").value)
    };
    if(!payload.itemName) return showAlert("物品名は必須です");
    toggleLoading(true);
    const res = await callGasApi("update_item", payload);
    toggleLoading(false);
    if(res) { 
      clearCache(); // ★更新時はキャッシュ破棄
      dom.modals.edit.classList.add("hidden"); showAlert("更新しました", () => loadItems(true)); 
    }
  });

  // ★ Inventory Resume (棚卸し再開機能 ＋ 1つ戻るボタン)
  document.getElementById("inventory-count-button").addEventListener("click", async () => {
    toggleLoading(true);
    const [itemsRes, progRes] = await Promise.all([callGasApi("get_item_list"), callGasApi("get_inventory_progress")]);
    toggleLoading(false);
    if(itemsRes && itemsRes.data) {
      state.inventoryCount.items = itemsRes.data;
      state.inventoryCount.currentIndex = progRes ? (progRes.currentIndex || 0) : 0;
      displayCurrentInventoryItem();
      showView("view-inventory-count");
    }
  });

  const displayCurrentInventoryItem = () => {
    const { items, currentIndex } = state.inventoryCount;
    if(currentIndex >= items.length) {
      callGasApi("save_inventory_progress", { currentIndex: 0 }); // 完了したらリセット(非同期)
      showDoneAnd("棚卸し完了", "全ての物品の確認が終わりました。", goHome); return; 
    }
    const item = items[currentIndex];
    state.inventoryCount.currentItemId = item.itemId;
    document.getElementById("inventory-count-progress").textContent = `${currentIndex+1} / ${items.length}`;
    document.getElementById("inventory-item-name").textContent = item.itemName;
    document.getElementById("inventory-usefor").textContent = item.useFor || "—";
    setProgressiveImage(document.getElementById("inventory-image"), item.imageUrl);
    const input = document.getElementById("inventory-actual-stock");
    input.value = item.stock; input.focus();
    sizeInventoryView();
  };

  document.getElementById("inventory-confirm-button").addEventListener("click", async () => {
    const qty = parseInt(document.getElementById("inventory-actual-stock").value, 10);
    if(isNaN(qty) || qty < 0) return showAlert("有効な在庫数を入力してください");
    
    toggleLoading(true);
    const res = await callGasApi("stock_update", { itemId: state.inventoryCount.currentItemId, type: "棚卸修正", quantity: qty, isCorrection: true });
    
    if(res) {
      clearCache(); // ★在庫更新なのでキャッシュ破棄
      const nextIndex = state.inventoryCount.currentIndex + 1;
      await callGasApi("save_inventory_progress", { currentIndex: nextIndex }); // 進捗を裏で保存
      toggleLoading(false);
      state.inventoryCount.currentIndex = nextIndex;
      if(res.message.includes('カート')) showAlert(res.message, displayCurrentInventoryItem);
      else displayCurrentInventoryItem();
    } else {
      toggleLoading(false);
    }
  });

  // ★ 追加機能：棚卸し時に「1つ前に戻る」
  document.getElementById("inventory-prev-button").addEventListener("click", async () => {
    if (state.inventoryCount.currentIndex > 0) {
      const prevIndex = state.inventoryCount.currentIndex - 1;
      toggleLoading(true);
      await callGasApi("save_inventory_progress", { currentIndex: prevIndex }); // 戻った状態も保存
      toggleLoading(false);
      state.inventoryCount.currentIndex = prevIndex;
      displayCurrentInventoryItem();
    } else {
      showAlert("これが最初の物品です。");
    }
  });

  document.getElementById("inventory-back-button").addEventListener("click", () => goHome()); // 中断しても再開できる

  // Cart
  document.getElementById("cart-button").addEventListener("click", async () => {
    toggleLoading(true);
    const res = await callGasApi("get_cart");
    toggleLoading(false);
    if(res) {
      state.cartItems = res.data;
      const c = document.getElementById("cart-container");
      if(!state.cartItems.length) { c.innerHTML = '<p class="text-center text-gray-500 py-6">発注が必要な物品はありません。</p>'; document.getElementById("submit-cart-button").classList.add("hidden"); return; }
      document.getElementById("submit-cart-button").classList.remove("hidden");
      
      const grouped = {};
      state.cartItems.forEach(i => { const s = i.supplierEmail || '未設定'; if(!grouped[s]) grouped[s]=[]; grouped[s].push(i); });
      c.innerHTML = Object.keys(grouped).map(sup => `
        <div class="border rounded-lg p-3 bg-white shadow-sm border-blue-200">
          <h3 class="font-bold text-blue-800 border-b pb-2 mb-3 text-sm">宛先: ${sup}</h3>
          <div class="space-y-4">
            ${grouped[sup].map(i => `
              <div class="text-sm border-l-4 border-gray-300 pl-2">
                <div class="font-semibold">${i.itemName}</div>
                <div class="flex justify-between items-center mt-2">
                  <div class="text-xs text-gray-600">在庫: <b>${i.stock}</b> \vert{} 未納: <b>${i.orderedQuantity}</b> | 点: <b class="text-red-500">${i.reorderPoint}</b></div>
                  <div class="flex items-center space-x-2 bg-pink-50 p-1 rounded">
                    <label class="text-xs font-bold text-pink-700">発注数:</label>
                    <input type="number" class="cart-qty-input border border-pink-300 rounded w-16 p-1 text-center font-bold text-lg" data-id="${i.itemId}" value="${i.suggestedQty}" min="0">
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      showView("view-cart");
    }
  });

  document.getElementById("submit-cart-button").addEventListener("click", () => {
    const orders = [];
    document.querySelectorAll('.cart-qty-input').forEach(inp => {
      const q = parseInt(inp.value, 10);
      if(q > 0) { const i = state.cartItems.find(x => x.itemId === inp.dataset.id); if(i) orders.push({...i, quantity: q}); }
    });
    if(!orders.length) return showAlert('発注する物品がありません。');
    showConfirm(`${orders.length}件の物品を一括発注します。よろしいですか？`, async () => {
      hideAllModals(); toggleLoading(true);
      const res = await callGasApi("submit_batch_orders", { orders });
      toggleLoading(false);
      if(res) { clearCache(); showDoneAnd("一括発注 完了", res.message, goHome); }
    });
  });

  // History
  document.getElementById("order-history-button").addEventListener("click", async () => {
    toggleLoading(true); const res = await callGasApi("get_order_history"); toggleLoading(false);
    if(res) {
      document.getElementById("order-history-list").innerHTML = res.data.length === 0 ? `<p class="text-center text-gray-500">履歴はありません。</p>` : res.data.map(r => `
        <div class="border rounded-md p-3 flex justify-between items-center bg-white shadow-sm">
          <div><p class="font-semibold">${r.itemName}</p><p class="text-xs text-gray-500">${r.orderDate} / 数量: ${r.quantity} / ${r.status}</p></div>
          ${r.status==="注文済み" ? `<button class="cancel-order-button bg-blue-500 text-white px-3 py-1 rounded text-sm" data-mail="${r.mailId}" data-hist="${r.historyId}">キャンセル</button>` : ``}
        </div>
      `).join("");
      showView("view-order-history");
    }
  });

  document.getElementById("order-history-list").addEventListener("click", (e) => {
    const btn = e.target.closest(".cancel-order-button"); if(!btn) return;
    showConfirm("この注文をキャンセルしますか？", async () => {
      hideAllModals(); toggleLoading(true);
      const res = await callGasApi("cancel_order", { mailId: btn.dataset.mail, historyId: btn.dataset.hist });
      toggleLoading(false);
      if(res) { clearCache(); showAlert("キャンセルしました。", () => document.getElementById("order-history-button").click()); }
    });
  });

  // Photo
  function compressImageToDataUrl(file){
    return new Promise((res,rej)=>{
      const img=new Image(), reader=new FileReader();
      reader.onload=()=>{
        img.onload=()=>{
          let {width,height}=img; const scale=Math.min(1,1024/Math.max(width,height));
          width=Math.round(width*scale); height=Math.round(height*scale);
          const canvas=document.createElement("canvas"); canvas.width=width; canvas.height=height;
          canvas.getContext("2d").drawImage(img,0,0,width,height);
          res(canvas.toDataURL("image/jpeg",0.8));
        };
        img.onerror=()=>rej(new Error("画像読込失敗")); img.src=reader.result;
      };
      reader.onerror=()=>rej(new Error("ファイル読込失敗")); reader.readAsDataURL(file);
    });
  }

  function pickAndUploadPhoto(itemId){
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
    inp.onchange=async()=>{
      const file=inp.files[0]; if(!file) return;
      try{
        toggleLoading(true); const dataUrl=await compressImageToDataUrl(file);
        const [pfx,base64]=dataUrl.split(","); const mime=(pfx.match(/data:(.*?);base64/)||[])[1]||"image/jpeg";
        const res = await callGasApi("upload_item_image", { itemId, base64, mimeType:mime, fileName:file.name.replace(/[^\w.-]/g,"_") });
        toggleLoading(false);
        if(res) { clearCache(); showAlert("画像を登録しました。", () => loadItems(true)); }
      }catch(e){ toggleLoading(false); showAlert("エラー: "+e.message); }
    };
    inp.click();
  }

  // Register New
  document.getElementById("new-item-button").addEventListener("click", () => { loadSupplierEmails(); showView("view-new-item"); });
  let newItemPhotoUrl = '';
  document.getElementById("new-item-photo-button").addEventListener("click", () => {
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
    inp.onchange=async()=>{
      const file=inp.files[0]; if(!file) return;
      try{ toggleLoading(true); newItemPhotoUrl=await compressImageToDataUrl(file); document.getElementById("new-item-photo-preview").innerHTML=`<img src="${newItemPhotoUrl}">`; showAlert("写真を選択しました。"); }
      catch(e){ showAlert("エラー"); } finally { toggleLoading(false); }
    }; inp.click();
  });

  document.getElementById("submit-new-item").addEventListener("click", async () => {
    const payload = {
      itemName: document.getElementById("new-item-name").value.trim(), model: document.getElementById("new-model").value.trim(),
      stock: Number(document.getElementById("new-stock").value), reorderPoint: Number(document.getElementById("new-reorder-point").value),
      price: Number(document.getElementById("new-price").value), supplierEmail: document.getElementById("new-supplier-email").value.trim(),
      parLevel: document.getElementById("new-par-level").value.trim(), useFor: document.getElementById("new-use-for").value.trim(),
      imageUrl: newItemPhotoUrl
    };
    if(!payload.itemName || !payload.stock || !payload.reorderPoint || !payload.price || !payload.supplierEmail) return showAlert("必須項目を入力してください");
    toggleLoading(true);
    const res = await callGasApi("item_register", payload);
    toggleLoading(false);
    if(res) {
      clearCache();
      showAlert("登録しました。"); document.querySelectorAll("#view-new-item input").forEach(i=>i.value="");
      newItemPhotoUrl=''; document.getElementById("new-item-photo-preview").innerHTML='<span class="text-gray-400 text-sm">写真未登録</span>';
    }
  });

  // Listeners Misc
  document.getElementById("item-list-button").addEventListener("click", () => loadItems(false));
  document.getElementById("refresh-item-list").addEventListener("click", () => loadItems(true));
  document.getElementById("item-search-input").addEventListener("input", renderItems);
  document.getElementById("filter-reorder-needed").addEventListener("change", renderItems);
  document.getElementById("filter-on-order").addEventListener("change", renderItems);
  document.getElementById("edit-item-cancel").addEventListener("click", () => dom.modals.edit.classList.add("hidden"));
  document.querySelectorAll(".back-button").forEach(b => b.addEventListener("click", e => { const t = e.currentTarget.dataset.target; t ? showView(t) : goBack(); }));
  document.getElementById("main-menu-button").addEventListener("click", goHome);
  document.getElementById("logout-button").addEventListener("click", () => { state.user = null; dom.loginId.value = ""; clearCache(); goHome(); showView("view-login"); });
  document.getElementById("alert-ok-button").addEventListener("click", () => { dom.modals.alert.classList.add("hidden"); if(alertCb) alertCb(); alertCb=null; });
  document.getElementById("confirm-cancel-button").addEventListener("click", () => dom.modals.confirm.classList.add("hidden"));
  document.getElementById("confirm-ok-button").addEventListener("click", () => { dom.modals.confirm.classList.add("hidden"); if(confirmCb) confirmCb(); confirmCb=null; });
  
  const setupDrumroll = inp => {
    inp.addEventListener("wheel", e => { e.preventDefault(); inp.value = Math.max(0, (parseInt(inp.value)||0) + (e.deltaY<0?1:-1)); }, {passive:false});
    document.getElementById("roll-inc").addEventListener("click",()=>inp.value = Math.max(0, (parseInt(inp.value)||0)+1));
    document.getElementById("roll-dec").addEventListener("click",()=>inp.value = Math.max(0, (parseInt(inp.value)||0)-1));
  };
  setupDrumroll(document.getElementById("inventory-actual-stock"));
  
  showView("view-login");
});
</script>
</body>
</html>
