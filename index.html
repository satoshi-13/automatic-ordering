<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在庫管理">
<meta name="theme-color" content="#0e5c66">
<title>在庫管理</title>
<script>try{var t=JSON.parse(localStorage.getItem('inv7_theme')||'"auto"');if(t!=='auto')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#13212e; --muted:#5d6b78; --faint:#a9b5bf; --line:#d6dee5;
  --accent:#0e5c66; --on-accent:#ffffff; --accent-soft:#dcefF1;
  --ok:#2e7d4f; --ok-bg:#e1f3e8; --warn:#7a5000; --warn-bg:#fff1b8; --warn-line:#e0b400;
  --alert:#c0303a; --alert-bg:#fbe3e4; --key:#e3e9ee; --empty:#eef1f4; --head:#0e5c66; --on-head:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#18242f; --ink:#e6edf2; --muted:#93a3b1; --faint:#56687a; --line:#2a3a48;
  --accent:#4cc3cf; --on-accent:#06252a; --accent-soft:#163a40;
  --ok:#6fd69a; --ok-bg:#163223; --warn:#ffd45c; --warn-bg:#3a3110; --warn-line:#c9a200;
  --alert:#ff7b84; --alert-bg:#3d1a1d; --key:#223241; --empty:#141f29; --head:#123540; --on-head:#e6f6f8;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#18242f; --ink:#e6edf2; --muted:#93a3b1; --faint:#56687a; --line:#2a3a48;
  --accent:#4cc3cf; --on-accent:#06252a; --accent-soft:#163a40;
  --ok:#6fd69a; --ok-bg:#163223; --warn:#ffd45c; --warn-bg:#3a3110; --warn-line:#c9a200;
  --alert:#ff7b84; --alert-bg:#3d1a1d; --key:#223241; --empty:#141f29; --head:#123540; --on-head:#e6f6f8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ヘッダー */
.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--on-head);
  padding:calc(env(safe-area-inset-top,0px) + 9px) 14px 9px;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
#sync{font-size:12px;opacity:.9}
.top .icon{color:var(--on-head);width:36px;height:36px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.top .icon:active{background:rgba(255,255,255,.18)}
.top .who{color:var(--on-head);font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid currentColor}
main{max-width:560px;margin:0 auto;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 40px)}
main.with-bar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
main.with-sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 380px)}
h2.sec{font-size:14px;margin:16px 2px 6px;color:var(--muted);font-weight:600}
.banner{padding:9px 12px;border-radius:10px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--alert-bg);color:var(--alert)}
.chip{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap;font-weight:600}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.alert{background:var(--alert-bg);color:var(--alert)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.adm{background:var(--accent-soft);color:var(--accent)}

/* 見出し（戻る＋タイトル） */
.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{font-size:15px;color:var(--accent);font-weight:600;padding:8px 0;white-space:nowrap}
.entry-head h2{margin:0;flex:1;text-align:right;color:var(--ink);font-size:20px;line-height:1.25}
.entry-head h2 small{display:block;font-size:12px;color:var(--muted);font-weight:400}

/* ログイン */
.who-title{font-size:22px;font-weight:700;margin:18px 0 2px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0 8px}
.box{height:68px;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:32px;font-weight:700}
.box.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ホーム */
.alertbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--alert-bg);color:var(--alert);border:2px solid var(--alert);margin-bottom:4px}
.alertbar b{font-size:16px;white-space:nowrap}
.alertbar span{font-size:13px;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left}
.stat .lab{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.stat .v{font-size:26px;font-weight:700;line-height:1.2}
.stat .v small{font-size:14px;font-weight:500;margin-left:3px}
.stat.warn{background:var(--warn-bg);border-color:var(--warn-line)} .stat.warn .lab{color:var(--warn)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:88px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between}
.mtile .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.mtile .t{font-size:18px;font-weight:700;line-height:1.25}
.mtile:active,.stat:active{transform:scale(.98)}

/* 一覧 */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:none;min-width:0}
.search svg{width:18px;height:18px;flex:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:6px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--key);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.seg2 button{height:38px;border-radius:9px;font-size:15px;font-weight:700;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(10,30,40,.15)}
.cnt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin:4px 2px 6px}
.cnt b{color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.irow{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--line);border-left:6px solid transparent}
.irow:last-child{border-bottom:0}
.irow.warn{border-left-color:var(--warn-line)} .irow.alert{border-left-color:var(--alert)}
.irow .info{flex:1;min-width:0;text-align:left;padding:2px 0}
.irow .nm{font-weight:700;font-size:15px;line-height:1.3}
.irow .md{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.irow .stock{text-align:right;min-width:50px}
.irow .stock b{display:block;font-size:24px;line-height:1.1}
.irow .stock span{font-size:11px;color:var(--muted);white-space:nowrap}
.irow .acts{display:flex;flex-direction:column;gap:4px}
.ab{width:56px;height:36px;border-radius:9px;border:2px solid var(--line);background:var(--bg);font-size:14px;font-weight:700}
.ab.in{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.empty-msg{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px}

/* 入力画面のタイル */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;min-height:88px;
  display:flex;flex-direction:column;justify-content:space-between}
.tile .lab{font-size:13px;color:var(--muted);font-weight:600}
.tile .tv{font-size:30px;font-weight:700;line-height:1.1}
.tile .tv small{font-size:14px;font-weight:500;margin-left:3px}
.tile .tsub{font-size:12px;min-height:16px;color:var(--muted)}
.tile.act{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile.warn{background:var(--warn-bg);border-color:var(--warn-line)} .tile.warn .tsub,.tile.warn .lab{color:var(--warn)}
.tile.alert{background:var(--alert-bg);border-color:var(--alert)} .tile.alert .tsub,.tile.alert .lab{color:var(--alert)}
.tile.warn.act,.tile.alert.act{box-shadow:0 0 0 3px var(--accent)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kind button{height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;line-height:1.2}
.kind button small{display:block;font-size:12px;font-weight:500;opacity:.85}
.kind button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kind button.on.w{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.infoline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.infoline span{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.ph{width:96px;height:96px;border-radius:10px;background:var(--empty);color:var(--muted);font-size:12px;display:grid;place-items:center;flex:none;overflow:hidden;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{font-size:18px;font-weight:700;line-height:1.3}
.card .md{font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px}
.nav .sp{flex:1;text-align:center;font-weight:700}

/* 棚卸し（写真を大きく、上下ボタンで数を合わせる） */
.cphoto{width:100%;min-height:120px;border-radius:14px;color:var(--muted);font-size:14px;
  display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.cphoto.none{aspect-ratio:4/3;max-height:30vh;background:var(--empty)}
/* 写真の縦横の比率のまま、切らずに全体を表示（横は枠の幅まで・縦は画面の約半分まで） */
.cphoto img{display:block;max-width:100%;max-height:48vh;width:auto;height:auto;border-radius:14px;background:var(--empty)}
.cinfo{margin:0 2px 8px}
.cinfo .nm{font-size:19px;font-weight:700;line-height:1.3}
.cinfo .md{font-size:13px;color:var(--muted)}
.cinfo .prev{font-size:14px;margin-top:2px}
.cinfo .prev b{font-size:16px}
.cstep{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:8px;
  box-shadow:0 0 0 3px var(--accent-soft)}
.cstep.warn{background:var(--warn-bg);border-color:var(--warn-line);box-shadow:none}
.cstep .sb{width:76px;height:76px;flex:none;border-radius:14px;background:var(--key);font-size:38px;font-weight:700;color:var(--accent);line-height:1;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .06s,background .06s}
.cstep .sb:active,.cstep .sb.down{background:var(--line);transform:scale(.94)}
.cstep .cv{flex:1;min-width:0;text-align:center;padding:2px 0;border-radius:12px}
.cstep .cv b{display:block;font-size:46px;line-height:1.05;font-weight:700}
.cstep .cv small{display:block;font-size:13px;color:var(--muted);font-weight:600;min-height:18px}
.cstep.warn .cv small{color:var(--warn)}
.chint{font-size:13px;margin:8px 2px 0;color:var(--muted);min-height:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chint.warn{color:var(--warn);font-weight:600}
.chint button{color:var(--accent);font-weight:700;font-size:14px;padding:4px 0;text-decoration:underline}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.cbar .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:1fr 2.2fr;gap:8px}
.cbar button{height:56px;border-radius:14px;font-size:16px;font-weight:700;background:var(--key)}
.cbar .go{background:var(--accent);color:var(--on-accent);font-size:17px}

/* テンキー（下から出る） */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(10,30,40,.12);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.sheet-in{max-width:536px;margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet-head b{flex:1;font-size:16px}
.sheet-head button{height:44px;padding:0 14px;border-radius:10px;font-weight:700;font-size:15px;background:var(--key)}
.sheet-head .go{background:var(--accent);color:var(--on-accent)}
.hint{font-size:13px;min-height:38px;margin:0 2px 6px;color:var(--muted)}
.hint.warn{color:var(--warn);font-weight:700} .hint.alert{color:var(--alert);font-weight:700} .hint.ok{color:var(--ok);font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keypad button{background:var(--key);height:56px;border-radius:12px;font-size:25px;font-weight:600;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .06s,background .06s}
.keypad button:active,.keypad button.down{background:var(--line);transform:scale(.95)}

/* 保存バー */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.savebar button{display:block;width:100%;max-width:536px;margin:0 auto;height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;line-height:1.2}
.savebar button small{display:block;font-size:12px;font-weight:500;opacity:.85}

/* 発注カート・履歴 */
.gh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin:12px 2px 6px}
.gh span{font-size:13px;color:var(--muted);font-weight:600}
.crow{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.crow:last-child{border-bottom:0}
.crow .nm{font-weight:700;font-size:15px;line-height:1.3}
.crow .md{font-size:12px;color:var(--muted)}
.line{display:flex;align-items:center;gap:8px}
.step{display:flex;align-items:center;background:var(--bg);border-radius:12px}
.step button{width:46px;height:46px;font-size:22px;font-weight:700;color:var(--accent)}
.step b{min-width:52px;text-align:center;font-size:20px}
.step b small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.price{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.price b{display:block;font-size:16px;color:var(--ink)}
.hrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.hrow:last-child{border-bottom:0}
.hrow:active{background:var(--bg)}
.hrow .info{flex:1;min-width:0}
.hrow .nm{font-weight:700;font-size:14px;line-height:1.3}
.hrow .md{font-size:12px;color:var(--muted)}
.hrow .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hrow .qty{font-weight:700}
.hrow .amt{font-size:12px;color:var(--muted)}
.range{display:flex;gap:6px;align-items:center;margin-top:4px}
.range input{flex:1;min-width:0;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* 要確認 */
.acard{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.acard.alert{border-color:var(--alert)} .acard.warn{border-color:var(--warn-line)}
.acard .nm{font-size:17px;font-weight:700;line-height:1.3}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fact{background:var(--bg);border-radius:10px;padding:5px 10px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-size:18px}
.acard .note{font-size:13px;color:var(--muted)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;padding:4px 8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--alert);border-color:var(--alert)}

/* フォーム */
.form{display:flex;flex-direction:column;gap:10px}
.fgrp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fgrp h3{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field label em{font-style:normal;color:var(--alert);margin-left:4px;font-size:11px}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fnote{font-size:12px;color:var(--muted)}
.photo-row{display:flex;gap:12px;align-items:center}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:10px 2px}

/* 詳細シート（発注履歴） */
.dsheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 24px rgba(10,30,40,.18);padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.dsheet .in{max-width:536px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dsheet h3{margin:0;font-size:18px}
.dsheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.dsheet dt{color:var(--muted)} .dsheet dd{margin:0}
.scrim{position:fixed;inset:0;z-index:7;background:rgba(5,15,20,.35)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%) translateY(-12px);opacity:0;visibility:hidden;
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;width:max-content;max-width:92vw;
  display:flex;gap:16px;align-items:center;transition:transform .18s,opacity .18s,visibility .18s;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#busy{position:fixed;inset:0;z-index:30;background:rgba(5,15,20,.25);display:grid;place-items:center}
#busy div{background:var(--surface);color:var(--ink);padding:14px 20px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>在庫管理</h1>
  <span id="sync"></span>
  <button class="icon" id="theme" data-act="theme"></button>
  <button class="who" id="who" data-act="logout" hidden></button>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>
<div id="busy" hidden><div id="busy-msg">処理中…</div></div>

<script>
/* ===== 設定 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxt7sAKo4d1H72FA0fqGgrdoYOQnU2OaYLis18k1l1ZIw4HsYuhGhdjqipc6_5W-uHr/exec';
const VERSION = 'v7.5';

const app = document.getElementById('app');
const store = {
  get(k, d) { try { const v = localStorage.getItem('inv7_' + k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('inv7_' + k, JSON.stringify(v)); } catch (_) {} },
  del(k) { try { localStorage.removeItem('inv7_' + k); } catch (_) {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
function fmtDay(s) { const [y, m, d] = s.split('-').map(Number); return `${m}/${d}(${'日月火水木金土'[new Date(y, m - 1, d).getDay()]})`; }

/* ===== 状態 ===== */
const S = {
  user: null, view: 'login', items: [], itemsLoaded: false, error: '',
  alerts: null, orders: null, cart: null, suppliers: [],
  itemsFilter: 'all', q: '',
  hist: { mode: 'day', period: 'month', st: 'all', q: '', from: '', to: '', detail: null },
  stock: null, count: null, form: null, login: ''
};
const isAdmin = () => !!S.user && S.user.role === '管理者';
const itemById = id => S.items.find(i => i.itemId === String(id));

/* ===== 表示テーマ（自動 → 明るい → 暗い） ===== */
const THEMES = { auto: ['◐', '自動（端末の設定に合わせる）'], light: ['☀', '明るい表示'], dark: ['☾', '暗い表示'] };
let theme = store.get('theme', 'auto');
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const b = document.getElementById('theme');
  b.textContent = THEMES[theme][0];
  b.setAttribute('aria-label', '表示の切り替え：' + THEMES[theme][1]);
  const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#123540' : '#0e5c66';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ===== 通信 ===== */
async function call(action, payload = {}) {
  const body = { action, payload: Object.assign({}, payload) };
  if (S.user && action !== 'login') body.payload.auth = { loginId: S.user.loginId };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl.signal });
    const j = await r.json();
    if (j.status === 'error') { const e = new Error(j.message || 'エラーが起きました'); e.server = true; throw e; }
    return j;
  } catch (e) {
    if (e.server) {
      if (/認証/.test(e.message)) setTimeout(() => logout(true), 50);
      throw e;
    }
    const n = new Error('通信できません。電波の良い場所でもう一度お試しください');
    n.net = true; throw n;
  } finally { clearTimeout(timer); }
}
async function blocking(msg, fn) {
  document.getElementById('busy-msg').textContent = msg;
  document.getElementById('busy').hidden = false;
  try { return await fn(); }
  catch (e) { toast(e.message); return null; }
  finally { document.getElementById('busy').hidden = true; }
}

/* =========================================================
 * 送信箱（入庫・出庫・棚卸しは押した瞬間に画面へ反映し、裏で順番に送る）
 * ======================================================= */
const OB = { ops: store.get('outbox', []), busy: false, timer: null };
const saveOutbox = () => store.set('outbox', OB.ops);
function enqueue(action, payload, local) {
  const op = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), action, payload, local: local || null, user: S.user && S.user.loginId };
  OB.ops.push(op); saveOutbox();
  if (op.local) applyLocal(op.local);
  kick(200);
}
function applyLocal(l) {
  const it = itemById(l.itemId); if (!it) return;
  const q = Number(l.quantity);
  if (l.type === '入庫') { it.orderedQuantity = Math.max(0, it.orderedQuantity - q); it.stock += q; }
  else if (l.type === '保証品入庫') it.stock += q;
  else if (l.type === '出庫') it.stock = Math.max(0, it.stock - q);
  else if (l.type === '棚卸修正') it.stock = q;
}
function kick(delay) { clearTimeout(OB.timer); OB.timer = setTimeout(drain, delay); updateSync(); }
async function drain() {
  if (OB.busy || !OB.ops.length || !S.user) return;
  OB.busy = true; updateSync();
  const op = OB.ops[0];
  try {
    const res = await call(op.action, op.payload);
    OB.ops.shift(); saveOutbox();
    if (res && res.needsCheck) { toast(res.message); S.alerts = null; }
  } catch (e) {
    if (e.net) { OB.busy = false; updateSync(); kick(8000); return; }   // 電波が戻るまで端末に残す
    OB.ops.shift(); saveOutbox();                                       // サーバーが断った操作は捨てて最新を取り直す
    toast('記録できませんでした：' + e.message);
    S.itemsLoaded = false;
  }
  OB.busy = false;
  if (OB.ops.length) kick(0);
  else { updateSync(); refreshQuiet(); }
}
function updateSync() {
  const n = OB.ops.length;
  document.getElementById('sync').textContent = !n ? '' : (navigator.onLine === false ? `未送信 ${n}件` : '送信中…');
}

/* ===== 読み込み ===== */
let refreshTimer;
function refreshQuiet() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (OB.ops.length || !S.user) return;
    await loadItems(true);
    if (isAdmin() || S.view === 'alerts') loadAlerts(true);
  }, 1200);
}
async function loadItems(quiet) {
  try {
    const r = await call('get_item_list', { forceRefresh: !quiet });
    S.items = r.data || []; S.itemsLoaded = true; S.error = '';
    store.set('items_' + S.user.role, S.items);
    OB.ops.forEach(o => o.local && applyLocal(o.local));
  } catch (e) { S.error = e.message; }
  if (['home', 'items'].includes(S.view)) render();
}
const loading = {};
async function loadAlerts(quiet) {
  if (loading.alerts) return; loading.alerts = true;
  try { const r = await call('get_alerts'); S.alerts = r.data || []; S.lateDays = r.lateDays; }
  catch (e) { if (!quiet) toast(e.message); if (!S.alerts && !quiet) S.alerts = []; }
  loading.alerts = false;
  if (['home', 'alerts'].includes(S.view)) render();
}
async function loadOrders() {
  if (loading.orders) return; loading.orders = true;
  try { const r = await call('get_order_history'); S.orders = r.data || []; }
  catch (e) { toast(e.message); if (!S.orders) S.orders = []; }
  loading.orders = false;
  if (['home', 'history'].includes(S.view)) render();
}

/* ===== トースト ===== */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* =========================================================
 * テンキー（電話と同じ並び）
 *  ・指が触れた瞬間（pointerdown）に反応し、離すのを待たない
 *  ・押すたびに画面全体は描き直さず、数字と案内の部分だけ書き換える
 * ======================================================= */
const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'];
const KP = { value: '', max: 4, onChange: null, keepZero: false };
function keypadHTML() {
  return `<div class="keypad">${KEYS.map(k => `<button type="button" data-key="${k}" aria-label="${k === '⌫' ? '1文字消す' : k === 'C' ? 'クリア' : k}">${k}</button>`).join('')}</div>`;
}
// keepZero：ユーザー番号のように先頭の0も文字として残す（数量入力では「0→5」を「5」にする）
function setKP(value, max, onChange, keepZero) { KP.value = value; KP.max = max; KP.onChange = onChange; KP.keepZero = !!keepZero; onChange(KP.value); }
function pressKey(k) {
  let v = KP.value;
  if (k === '⌫') v = v.slice(0, -1);
  else if (k === 'C') v = '';
  else if (v.length < KP.max) v = (v === '0' && !KP.keepZero ? '' : v) + k;
  KP.value = v;
  if (KP.onChange) KP.onChange(v);
}
let lastPointer = 0;
document.addEventListener('pointerdown', ev => {
  const b = ev.target.closest('[data-key]');
  if (!b || b.disabled) return;
  ev.preventDefault();               // フォーカス移動や長押しメニューを止めて、次のタップを取りこぼさない
  lastPointer = Date.now();
  b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 110);
  pressKey(b.dataset.key);
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-key]');
  if (!b) return;
  if (Date.now() - lastPointer < 700) return;   // タッチで処理済み。キーボード操作（Enter）のときだけここで受ける
  pressKey(b.dataset.key);
}, true);
const $ = id => document.getElementById(id);

/* =================== 画面 =================== */
function render() {
  const w = $('who');
  w.hidden = !S.user;
  w.textContent = S.user ? `${S.user.name.split(/\s|　/)[0]} ▾` : '';
  app.className = '';
  const V = { login: renderLogin, home: renderHome, items: renderItems, stock: renderStock, count: renderCount,
    form: renderForm, cart: renderCart, history: renderHistory, alerts: renderAlerts, report: renderReport };
  (V[S.view] || renderHome)();
  updateSync();
}
function go(view) { S.view = view; render(); window.scrollTo(0, 0); }
const head = (title, sub, backTo = 'home', backLabel = 'ホーム') =>
  `<div class="entry-head"><button class="back" data-act="go" data-v="${backTo}">‹ ${backLabel}</button><h2>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</h2></div>`;

/* ---- ログイン ---- */
function renderLogin() {
  app.className = 'with-sheet';
  app.innerHTML = `
    <p class="who-title">ユーザー番号</p>
    <p class="muted" style="margin:0">5桁の番号を入力してください</p>
    <div class="boxes num" id="boxes"></div>
    <p class="hint" id="lh"></p>
    <div class="sheet"><div class="sheet-in">${keypadHTML()}</div></div>`;
  setKP(S.login || '', 5, v => {
    S.login = v;
    $('boxes').innerHTML = [0, 1, 2, 3, 4].map(i => `<div class="box ${i === v.length ? 'on' : ''}">${esc(v[i] || '')}</div>`).join('');
    $('lh').textContent = v.length < 5 ? `あと${5 - v.length}桁` : '確認しています…';
    $('lh').className = 'hint';
    if (v.length === 5) doLogin(v);
  }, true);
}
async function doLogin(id) {
  try {
    const r = await call('login', { loginId: id });
    S.user = r.data; S.login = '';
    store.set('session', { user: S.user, day: todayStr() });
    S.items = store.get('items_' + S.user.role, []);
    S.itemsLoaded = false; S.alerts = null; S.orders = null;
    go('home'); loadItems(true); loadAlerts(true); if (isAdmin()) loadOrders();
    kick(0);
  } catch (e) {
    if (S.view !== 'login') return;
    $('lh').textContent = e.server ? '番号が見つかりません。もう一度入力してください' : e.message;
    $('lh').className = 'hint alert';
    KP.value = ''; S.login = '';
    $('boxes').innerHTML = [0, 1, 2, 3, 4].map(i => `<div class="box ${i === 0 ? 'on' : ''}"></div>`).join('');
  }
}
function logout(expired) {
  if (!expired && OB.ops.length && !confirm(`未送信の記録が${OB.ops.length}件あります。ログアウトすると送信されません。よろしいですか？`)) return;
  if (!expired && !OB.ops.length && !confirm('ログアウトしますか？')) return;
  if (S.user) store.del('items_' + S.user.role);
  store.del('session'); OB.ops = []; saveOutbox();
  S.user = null; S.items = []; S.alerts = null; S.orders = null; S.cart = null;
  go('login');
  if (expired) toast('もう一度ログインしてください');
}

/* ---- ホーム ---- */
function needOrder(i) { return (i.stock + i.orderedQuantity) < i.reorderPoint; }
function renderHome() {
  const items = S.items;
  const nNeed = items.filter(needOrder).length;
  const nOpen = items.filter(i => i.orderedQuantity > 0).length;
  const prog = store.get('countProg', null);
  const progN = prog && prog.day === todayStr() ? prog.index : 0;
  const nAlerts = S.alerts ? S.alerts.length : 0;
  let monthTotal = null;
  if (isAdmin() && S.orders) {
    const m = todayStr().slice(0, 7);
    monthTotal = S.orders.filter(o => o.date.startsWith(m) && o.status !== 'キャンセル済み').reduce((a, o) => a + (o.total || 0), 0);
  }
  app.innerHTML = `
    ${S.error ? `<div class="banner err">${esc(S.error)}</div>` : ''}
    ${nAlerts ? `<button class="alertbar" data-act="go" data-v="alerts"><b>要確認 ${nAlerts}件</b><span>入庫・未納・棚卸しで合わないものがあります</span><b aria-hidden="true">›</b></button>` : ''}
    <h2 class="sec">今日の状況</h2>
    <div class="stats num">
      <button class="stat ${nNeed ? 'warn' : ''}" data-act="items" data-f="need"><div class="lab">要発注</div><div class="v">${nNeed}<small>品目</small></div></button>
      <button class="stat" data-act="items" data-f="open"><div class="lab">未納の物品</div><div class="v">${nOpen}<small>品目</small></div></button>
      <button class="stat" data-act="count"><div class="lab">棚卸し（今日）</div><div class="v">${progN}<small>/ ${items.length}</small></div>
        <div class="progress"><i style="width:${items.length ? progN / items.length * 100 : 0}%"></i></div></button>
      ${isAdmin() ? `<button class="stat" data-act="go" data-v="history"><div class="lab">今月の発注額 <span class="chip adm">管理者</span></div><div class="v">${monthTotal === null ? '…' : yen(monthTotal)}</div></button>`
        : `<button class="stat" data-act="go" data-v="alerts"><div class="lab">要確認</div><div class="v">${S.alerts ? nAlerts : '…'}<small>件</small></div></button>`}
    </div>
    <h2 class="sec">メニュー</h2>
    <div class="menu">
      <button class="mtile" data-act="items" data-f="all"><span class="lab">在庫を見る・入庫・出庫</span><span class="t">物品一覧</span></button>
      <button class="mtile" data-act="count"><span class="lab">${progN ? `前回の続き ${progN + 1}品目めから` : '最初の物品から'}</span><span class="t">棚卸し</span></button>
      ${isAdmin() ? `<button class="mtile" data-act="cart"><span class="lab">要発注 ${nNeed} <span class="chip adm">管理者</span></span><span class="t">発注カート</span></button>` : ''}
      <button class="mtile" data-act="go" data-v="history"><span class="lab">日別・物品別に検索</span><span class="t">発注履歴</span></button>
      <button class="mtile" data-act="register"><span class="lab">写真・発注ルール</span><span class="t">新規物品登録</span></button>
      ${isAdmin() ? `<button class="mtile" data-act="go" data-v="report"><span class="lab">CSV出力 <span class="chip adm">管理者</span></span><span class="t">月次レポート</span></button>` : ''}
    </div>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:18px">在庫管理 ${VERSION}</p>`;
}

/* ---- 物品一覧 ---- */
const FILTERS = [['all', 'すべて'], ['need', '要発注'], ['low', '発注点以下'], ['open', '未納あり']];
function renderItems() {
  app.innerHTML = `
    ${head('物品一覧')}
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="物品名・型番・用途で検索" aria-label="検索" value="${esc(S.q)}" autocomplete="off"></label>
    <div class="filters">${FILTERS.map(([id, l]) => `<button class="${S.itemsFilter === id ? 'on' : ''}" data-act="filter" data-f="${id}">${l}</button>`).join('')}</div>
    <div id="ilist"></div>`;
  renderItemList();
}
function renderItemList() {
  const q = S.q.trim().toLowerCase();
  const f = S.itemsFilter;
  const rows = S.items.filter(i => {
    if (f === 'need' && !needOrder(i)) return false;
    if (f === 'low' && !(i.stock <= i.reorderPoint)) return false;
    if (f === 'open' && !(i.orderedQuantity > 0)) return false;
    if (q && !(`${i.itemName} ${i.model} ${i.useFor}`.toLowerCase().includes(q))) return false;
    return true;
  });
  const el = $('ilist'); if (!el) return;
  if (!S.items.length) { el.innerHTML = `<div class="empty-msg">${S.itemsLoaded ? '物品が登録されていません' : '読み込んでいます…'}</div>`; return; }
  el.innerHTML = `<div class="cnt"><span>${rows.length} 品目</span></div>
    <div class="list">${rows.length ? rows.map(itemRow).join('') : '<div class="empty-msg">条件に合う物品がありません</div>'}</div>`;
}
function itemRow(i) {
  const lvl = i.stock === 0 ? 'alert' : i.stock < i.reorderPoint ? 'warn' : '';
  const chip = i.orderedQuantity > 0 ? `<span class="chip ${lvl}">未納 ${i.orderedQuantity}</span>` : needOrder(i) ? `<span class="chip ${lvl || 'warn'}">要発注</span>` : '';
  const sub = [i.model, i.useFor].filter(Boolean).join('・');
  return `<div class="irow ${lvl}">
    <button class="info" data-act="edit" data-id="${i.itemId}"><div class="nm">${esc(i.itemName)}</div>
      <div class="md"><span>${esc(sub)}</span>${chip}${isAdmin() ? `<span>${yen(i.price)}</span>` : ''}</div></button>
    <div class="stock num"><b>${i.stock}</b><span>発注点 ${i.reorderPoint}</span></div>
    <div class="acts"><button class="ab in" data-act="stock" data-id="${i.itemId}" data-t="in">入庫</button><button class="ab" data-act="stock" data-id="${i.itemId}" data-t="out">出庫</button></div>
  </div>`;
}

/* ---- 入庫・出庫 ---- */
function openStock(id, dir) {
  const it = itemById(id); if (!it) return;
  S.stock = { id, dir, kind: 'normal', back: S.view === 'alerts' ? 'alerts' : 'items' };
  go('stock');
}
function renderStock() {
  const st = S.stock, it = itemById(st.id);
  if (!it) { go('items'); return; }
  const isIn = st.dir === 'in';
  app.className = 'with-sheet';
  app.innerHTML = `
    ${head(it.itemName, [it.model, it.useFor].filter(Boolean).join('・'), st.back, st.back === 'alerts' ? '要確認' : '一覧')}
    ${isIn ? `<div class="kind">
      <button class="${st.kind === 'normal' ? 'on' : ''}" data-act="kind" data-k="normal">通常入庫<small>発注した物が届いた</small></button>
      <button class="${st.kind === 'warranty' ? 'on w' : ''}" data-act="kind" data-k="warranty">メーカー保証品<small>無償・未納は減らない</small></button></div>
      <div class="infoline"><span>未納の発注</span><b class="num">${it.orderedQuantity}個</b></div>` : ''}
    <div class="tiles num">
      <div class="tile"><span class="lab">在庫</span><span class="tv">${it.stock}<small id="after"></small></span><span class="tsub">いまの帳簿</span></div>
      <div class="tile act" id="qtile"><span class="lab">${isIn ? '入庫数' : '出庫数'}</span><span class="tv"><span id="kv">－</span><small>個</small></span><span class="tsub">バラの個数</span></div>
    </div>
    <div class="sheet"><div class="sheet-in">
      <div class="sheet-head"><b>${isIn ? '入庫数' : '出庫数'}</b><button class="go" id="kgo" data-act="stockGo" disabled>${isIn ? '入庫する' : '出庫する'}</button></div>
      <div class="hint" id="kh"></div>${keypadHTML()}</div></div>`;
  setKP(st.value || '', 4, v => {
    st.value = v;
    const n = Number(v || 0);
    $('kv').textContent = v || '－';
    $('after').textContent = n ? ` → ${isIn ? it.stock + n : it.stock - n}` : '';
    let hint = isIn ? '入庫した数を入力してください' : '使った数を入力してください', cls = 'hint', ok = n > 0;
    if (n && isIn && st.kind === 'warranty') { hint = `保証品として記録します。未納（${it.orderedQuantity}個）はそのまま、金額は0円です`; cls = 'hint ok'; }
    else if (n && isIn && n > it.orderedQuantity) { hint = `未納（${it.orderedQuantity}個）より多い数です。保証品が混ざっていませんか？ このまま記録すると、多い分は「要確認」に入ります`; cls = 'hint alert'; }
    else if (n && isIn) hint = `未納 ${it.orderedQuantity}個 → ${it.orderedQuantity - n}個 になります`;
    else if (n && !isIn && n > it.stock) { hint = `在庫（${it.stock}個）より多くは出庫できません`; cls = 'hint alert'; ok = false; }
    else if (n && !isIn && it.stock - n < it.reorderPoint) { hint = `出庫後 ${it.stock - n}個。発注点（${it.reorderPoint}）を下回ります`; cls = 'hint warn'; }
    $('kh').textContent = hint; $('kh').className = cls;
    $('kgo').disabled = !ok;
  });

function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => rej(new Error('画像を読み込めませんでした')); img.src = reader.result;
    };
    reader.onerror = () => rej(new Error('ファイルを読み込めませんでした')); reader.readAsDataURL(file);
  });
}

  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async () => {

    try {

      const f = S.form;
      if (f.mode === 'new') { f.photo = dataUrl; render(); return; }
      const [pfx, base64] = dataUrl.split(',');
      const r = await blocking('写真を送っています…', () => call('upload_item_image', { itemId: f.itemId, base64, mimeType: (pfx.match(/data:(.*?);/) || [])[1] || 'image/jpeg', fileName: 'item_' + f.itemId + '.jpg' }));
      if (r) { f.photo = dataUrl; const it = itemById(f.itemId); if (it) it.imageUrl = r.imageUrl; toast('写真を登録しました'); render(); }

function histRange() {

  });
}
function renderHistList() {
  const el = $('hlist'); if (!el) return;
  if (!S.orders) { el.innerHTML = '<div class="empty-msg">読み込んでいます…</div>'; return; }
  const rows = filteredOrders(), byDay = S.hist.mode === 'day';
  const total = rows.filter(o => o.status !== 'キャンセル済み').reduce((s, o) => s + (o.total || 0), 0);
  const groups = new Map();
  rows.forEach(o => { const k = byDay ? (o.date || '日付なし') : o.itemName; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); });
  const all = S.orders;
  el.innerHTML = `<div class="cnt"><span>${rows.length}件の発注</span>${isAdmin() ? `<span>合計 <b class="num">${yen(total)}</b></span>` : ''}</div>
    ${rows.length ? [...groups].map(([k, os]) => `<div class="gh">${esc(byDay && k !== '日付なし' ? fmtDay(k) : k)}<span>${os.length}件${!byDay ? `・計${os.reduce((s, o) => s + o.qty, 0)}個` : ''}</span></div>
      <div class="list">${os.map(o => { const st = orderState(o);
        return `<button class="hrow" data-act="hdetail" data-i="${all.indexOf(o)}"><div class="info">
          <div class="nm">${esc(byDay ? o.itemName : (o.date ? fmtDay(o.date) : '日付なし') + '　' + (o.supplier || ''))}</div>
          <div class="md">${esc(byDay ? [o.supplier, o.user].filter(Boolean).join('・') : '発注 ' + o.user)}</div></div>
          <div class="rt num"><span class="qty">${o.qty}個</span><span class="chip ${st.cls}">${esc(st.label)}</span>${isAdmin() && o.status !== 'キャンセル済み' ? `<span class="amt">${yen(o.total)}</span>` : ''}</div></button>`; }).join('')}</div>`).join('')
      : '<div class="empty-msg">条件に合う発注はありません</div>'}`;
}
function histDetail() {
  const o = S.orders[S.hist.detail.i]; if (!o) return '';
  const st = orderState(o);
  const canCancel = isAdmin() && st.k === 'open' && o.historyId;
  return `<div class="scrim" data-act="hclose"></div><div class="dsheet" role="dialog" aria-label="発注の詳細"><div class="in">
    <h3>${esc(o.itemName)}</h3>
    <dl class="num"><dt>発注日時</dt><dd>${esc(o.ts || '不明')}</dd><dt>発注先</dt><dd>${esc(o.supplier || '－')}</dd><dt>発注者</dt><dd>${esc(o.user)}</dd>
      <dt>数量</dt><dd>${o.qty}個（入庫 ${o.received || 0}個）</dd><dt>状態</dt><dd><span class="chip ${st.cls}">${esc(st.label)}</span></dd>
      ${isAdmin() ? `<dt>単価</dt><dd>${yen(o.price)}</dd><dt>金額</dt><dd>${yen(o.total)}</dd>` : ''}</dl>
    <div class="acts2">${canCancel ? `<button class="btn danger" data-act="hcancel">発注をキャンセル</button>` : '<span></span>'}<button class="btn" data-act="hclose">閉じる</button></div>
  </div></div>`;
}
async function histCancel() {
  const o = S.orders[S.hist.detail.i];
  if (!o) return;
  const left = Math.max(0, o.qty - (o.received || 0));
  if (!confirm(`${o.itemName}（${o.received ? '残り' : ''}${left}個）の発注をキャンセルし、発注先へキャンセルのメールを送ります。よろしいですか？`)) return;
  const r = await blocking('キャンセルしています…', () => call('cancel_order', { historyId: o.historyId, mailId: o.mailId }));
  if (!r) return;
  toast(r.message || 'キャンセルしました'); S.hist.detail = null; S.orders = null; render(); loadItems(false); loadAlerts(true);
}

/* ---- 要確認 ---- */
const REASONS = {
  over: [['warranty', '保証品に変更', 'pri'], ['keep', '通常入庫で正しい', '']],
  count: [['out_missing', '出庫の記録漏れ', 'pri'], ['in_missing', '入庫の記録漏れ', ''], ['miscount', '前回の数え間違い', ''], ['other', 'その他・確認済み', '']],
  late: [['receive', '入庫を記録', 'pri'], ['wait', '納品待ちを確認', ''], ['cancel', '発注をキャンセル', 'danger']]
};
function renderAlerts() {
  if (!S.alerts) loadAlerts(false);
  const list = S.alerts || [];
  app.innerHTML = `${head(`要確認 ${S.alerts ? list.length + '件' : ''}`)}
    <p class="muted" style="font-size:13px;margin:0 2px 10px">発注・入庫・出庫・棚卸しの記録が合わないものです。${isAdmin() ? '理由を選ぶと確認済みになります。' : '確認は管理者が行います。'}</p>
    ${!S.alerts ? '<div class="empty-msg">読み込んでいます…</div>' : !list.length ? '<div class="empty-msg">確認が必要なものはありません</div>' : list.map(alertCard).join('')}`;
}
function alertCard(a) {
  let kind, cls, f1l, f1, f2l, f2, note = a.note;
  if (a.kind === 'over') { kind = '未納より多い入庫'; cls = 'alert'; f1l = `通常入庫（${a.ts} ${a.user}）`; f1 = `${a.qty}個`; f2l = '入庫前の在庫'; f2 = a.before === null ? '－' : `${a.before}個`;
    note = `${note}。メーカー保証品ではありませんか？`; }
  else if (a.kind === 'count') { kind = '棚卸しで不一致'; cls = 'warn'; f1l = '帳簿の在庫'; f1 = a.before === null ? '－' : `${a.before}個`; f2l = `数えた数（${a.ts} ${a.user}）`; f2 = `${a.qty}個`; }
  else { kind = '入庫がない'; cls = 'warn'; f1l = `発注（${a.ts}${a.supplier ? ' ' + a.supplier : ''}）`; f1 = `${a.qty}個`; f2l = '経過・未着'; f2 = `${a.days}日・${a.remaining}個`;
    note = `発注から${S.lateDays || 14}日以上、入庫の記録がありません。`; }
  const btns = isAdmin() ? `<div class="acts2">${REASONS[a.kind].map(([act, l, c]) => `<button class="btn ${c}" data-act="resolve" data-h="${a.historyId}" data-id="${a.itemId}" data-a="${act}">${l}</button>`).join('')}</div>` : '';
  return `<div class="acard ${cls}"><span class="chip ${cls}" style="align-self:flex-start">${kind}</span>
    <div class="nm">${esc(a.itemName)}</div>
    <div class="facts num"><div class="fact"><span>${esc(f1l)}</span><b>${esc(f1)}</b></div><div class="fact"><span>${esc(f2l)}</span><b>${esc(f2)}</b></div></div>
    <div class="note">${esc(note)}</div>${btns}</div>`;
}
async function resolve(b) {
  const h = Number(b.dataset.h), id = b.dataset.id, act = b.dataset.a;
  if (act === 'receive') { if (!itemById(id)) { toast('物品が見つかりません。一覧を更新してください'); return; } openStock(id, 'in'); return; }
  if (act === 'cancel' && !confirm('この発注をキャンセルし、発注先へキャンセルのメールを送ります。よろしいですか？')) return;
  const r = await blocking('記録しています…', () => call('resolve_alert', { historyId: h, itemId: id, action: act }));
  if (!r) return;
  S.alerts = (S.alerts || []).filter(a => a.historyId !== h);
  toast('確認済みにしました'); render();
  if (act === 'cancel' || act === 'warranty') { loadItems(false); S.orders = null; }
}

/* ---- 月次レポート（管理者） ---- */
function renderReport() {
  const m = S.reportMonth || todayStr().slice(0, 7);
  app.innerHTML = `${head('月次レポート')}
    <div class="fgrp"><p class="muted" style="margin:0;font-size:14px">指定した月の入庫・出庫・発注・棚卸しの記録と金額を、CSVファイルでダウンロードします。</p>
      <div class="field"><label for="rm">対象の月</label><input type="month" id="rm" value="${m}"></div>
      <button class="btn pri" data-act="report">CSVをダウンロード</button></div>`;
}
async function downloadReport() {
  const m = $('rm').value; if (!m) { toast('月を選んでください'); return; }
  S.reportMonth = m;
  const r = await blocking('集計しています…', () => call('get_monthly_report', { targetMonth: m }));
  if (!r) return;
  const rows = r.data || [];
  if (!rows.length) { toast('この月の記録はありません'); return; }
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['日時', '物品ID', '物品名', '種別', '数量', '単価', '金額', '担当者', '部署'].join(',')]
    .concat(rows.map(x => [q(x.date), q(x.itemId), q(x.itemName), q(x.type), x.quantity, x.price, x.totalAmount, q(x.user), q(x.department)].join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `在庫管理_月次レポート_${m}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${rows.length}件をダウンロードしました`);
}

/* =================== 操作 =================== */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'theme') { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; store.set('theme', theme); applyTheme(); toast(THEMES[theme][1]); }
  else if (act === 'logout') logout(false);
  else if (act === 'go') { if (b.dataset.v === 'home') { S.count = null; S.stock = null; } go(b.dataset.v); }
  else if (act === 'items' || act === 'filter') { S.itemsFilter = b.dataset.f || 'all'; if (act === 'items') { S.q = ''; go('items'); } else render(); }
  else if (act === 'stock') openStock(b.dataset.id, b.dataset.t);
  else if (act === 'kind') { S.stock.kind = b.dataset.k; render(); }
  else if (act === 'stockGo') stockGo();
  else if (act === 'count') openCount();
  else if (act === 'countSame') { const it = curCountItem(); if (it) { S.count.value = String(it.stock); updateCountUI(); } }
  else if (act === 'countKp') { S.count.kp = true; S.count.kpv = ''; render(); }
  else if (act === 'countKpCancel') { S.count.kp = false; render(); }
  else if (act === 'countKpDone') { if (S.count.kpv !== undefined && S.count.kpv !== '') S.count.value = String(Number(S.count.kpv)); S.count.kp = false; render(); }
  else if (act === 'countGo') countGo();
  else if (act === 'countPrev') { S.count.index = Math.max(0, S.count.index - 1); S.count.value = ''; S.count.kp = false; render(); }
  else if (act === 'edit') openForm(b.dataset.id);
  else if (act === 'register') openForm(null);
  else if (act === 'photo') pickPhoto();
  else if (act === 'formSave') formSave();
  else if (act === 'cart') openCart();
  else if (act === 'cartStep') {
    const i = S.cart.find(x => x.itemId === b.dataset.id);
    i.qty = Math.max(0, i.qty + Number(b.dataset.d) * (i.orderStep || 1)); render();
  }
  else if (act === 'cartSend') cartSend();
  else if (act === 'hmode') { S.hist.mode = b.dataset.m; render(); }
  else if (act === 'hperiod') { S.hist.period = b.dataset.p; render(); }
  else if (act === 'hstat') { S.hist.st = b.dataset.s; render(); }
  else if (act === 'hdetail') { S.hist.detail = { i: Number(b.dataset.i) }; render(); }
  else if (act === 'hclose') { S.hist.detail = null; render(); }
  else if (act === 'hcancel') histCancel();
  else if (act === 'resolve') resolve(b);
  else if (act === 'report') downloadReport();
});

/* 画面に戻ってきたら最新を取得・未送信を再送 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.user) return;
  const s = store.get('session', null);
  if (!s || s.day !== todayStr()) { logout(true); return; }   // ログインはその日のうちだけ有効
  kick(0);
  if (['home', 'items'].includes(S.view) && !OB.ops.length) { loadItems(true); loadAlerts(true); }
});
window.addEventListener('online', () => kick(0));
window.addEventListener('offline', updateSync);

/* 起動：その日のうちならログインを引き継ぎ、端末のデータで即表示 → 裏で最新を取得 */
(function start() {
  const s = store.get('session', null);
  if (s && s.day === todayStr() && s.user) {
    S.user = s.user;
    S.items = store.get('items_' + S.user.role, []);
    OB.ops.forEach(o => o.local && applyLocal(o.local));
    go('home'); loadItems(true); loadAlerts(true); if (isAdmin()) loadOrders(); kick(0);
  } else {
    store.del('session'); go('login');
  }
})();
</script>
</body>
</html>
